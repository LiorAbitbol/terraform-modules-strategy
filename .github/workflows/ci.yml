name: terraform-ci

on:
  pull_request:
  push:
    branches: ["main"]

permissions:
  contents: read

jobs:
  terraform:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: Terraform fmt (check)
        shell: bash
        run: |
          set -euo pipefail
          if compgen -G "**/*.tf" > /dev/null; then
            terraform fmt -check -diff -recursive
          else
            echo "No .tf files yet; skipping terraform fmt."
          fi

      - name: Terraform validate (all terraform roots)
        shell: bash
        run: |
          set -euo pipefail

          # Find directories that contain *.tf files (Terraform roots)
          mapfile -t TF_DIRS < <(find . -type f -name "*.tf" -not -path "./.terraform/*" -print0 | xargs -0 -n1 dirname | sort -u)

          if [ ${#TF_DIRS[@]} -eq 0 ]; then
            echo "No terraform roots yet; skipping terraform validate."
            exit 0
          fi

          for d in "${TF_DIRS[@]}"; do
            echo ""
            echo "==> Validating in: $d"
            terraform -chdir="$d" init -backend=false -input=false
            terraform -chdir="$d" validate
          done
      
      - name: Install terraform-docs
        shell: bash
        run: |
          set -euo pipefail
          VERSION="0.17.0"
          curl -sSLo /tmp/terraform-docs.tar.gz \
            "https://github.com/terraform-docs/terraform-docs/releases/download/v${VERSION}/terraform-docs-v${VERSION}-linux-amd64.tar.gz"
          tar -xzf /tmp/terraform-docs.tar.gz -C /tmp
          sudo mv /tmp/terraform-docs /usr/local/bin/terraform-docs
          terraform-docs version

      - name: Ensure scripts are executable
        shell: bash
        run: |
          chmod +x tools/terraform-docs/generate.sh

      - name: Verify terraform-docs are up to date
        shell: bash
        run: |
          set -euo pipefail
          ./tools/terraform-docs/generate.sh
          if ! git diff --exit-code; then
            echo ""
            echo "terraform-docs output is out of date. Run:"
            echo "  ./tools/terraform-docs/generate.sh"
            echo ""
            git diff
            exit 1
          fi
